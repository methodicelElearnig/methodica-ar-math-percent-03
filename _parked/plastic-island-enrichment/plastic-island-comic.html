  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Component-wide typography override: keep the card headings at their
    // designed size and standardize every other text element at 32px.
    const comicTypography = '<style id="plastic-island-comic-typography">' +
      'body :not(h1):not(h2){font-size:32px!important;}' +
      '[data-panel] p,[data-panel] div,[data-panel] span{' +
        'min-width:0;max-width:100%;overflow-wrap:anywhere;word-break:normal;' +
      '}' +
      '</style>';
    if (/<helmet>/i.test(template)) {
      template = template.replace(/<helmet>/i, '<helmet>' + comicTypography);
    } else {
      template = template.replace(/<\/head>/i, comicTypography + '</head>');
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

e-width=\"2.5\" transform=\"rotate(-14 20 41)\"><\u002Frect>\n              <circle cx=\"66\" cy=\"34\" r=\"8\" fill=\"none\" stroke=\"#211C18\" stroke-width=\"2.5\"><\u002Fcircle>\n              <circle cx=\"74\" cy=\"60\" r=\"3\" fill=\"#211C18\"><\u002Fcircle>\n            <\u002Fg>\n            <text x=\"262\" y=\"146\" text-anchor=\"middle\" font-family=\"Assistant\" font-weight=\"800\" font-size=\"13\" fill=\"#0A6E6D\">10×10 מ׳<\u002Ftext>\n          <\u002Fg>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font:800 18px 'Assistant'; color:#0A6E6D; letter-spacing:3px;\">כך מודדים · שלב 1<\u002Fdiv>\n        <h2 style=\"margin: 2px 0 6px; font: 700 52px/1.04 'Suez One','Assistant'; color: #211C18; font-family: Assistant\">כאן נכנסת המתמטיקה<\u002Fh2>\n        <p style=\"margin:0; font:600 23px/1.5 'Assistant'; color:#4A433C; max-width:44ch;\">אי אפשר לספור הכול. אז דוגמים: ספינת מחקר פורסת רשת בגודל קבוע ואוספת כל פיסת פלסטיק שנלכדה בה —<br><b style=\"color:#0A6E6D; white-space:nowrap;\">החלק הנתון<\u002Fb>.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============ PANEL 6 — PART TO WHOLE ============ -->\n    <div data-panel=\"6\" style=\"position: absolute; left: 2620px; top: 4000px; width: 880px; height: 640px; z-index: 1; border: 2.5px solid #211C18; border-radius: 22px 14px 20px 13px / 13px 22px 14px 20px; box-shadow: 7px 9px 0 rgba(33,28,24,.13); padding: 36px 42px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; transition: opacity .6s ease, box-shadow .6s ease; box-sizing: border-box; background-color: #ffffff\">\n      <div style=\"position:absolute; top:-16px; right:-16px; width:48px; height:48px; border-radius:50% 48% 52% 50%; background:#FCF8EE; border:2.5px solid #211C18; display:flex; align-items:center; justify-content:center; font:700 28px 'Suez One','Assistant'; color:#0F9E9C; box-shadow:3px 4px 0 rgba(33,28,24,.15);\">07<\u002Fdiv>\n      <div style=\"flex:1; min-height:0; display:flex; align-items:center; justify-content:center;\">\n        <svg viewBox=\"0 0 360 240\" style=\"width:100%; height:100%;\" preserveAspectRatio=\"xMidYMid meet\" fill=\"none\">\n          <g filter=\"url(#rough)\">\n            <rect x=\"32\" y=\"98\" width=\"60\" height=\"60\" rx=\"6\" fill=\"rgba(15,158,156,0.12)\" stroke=\"#211C18\" stroke-width=\"3.5\"><\u002Frect>\n            <path d=\"M47 98 v60 M62 98 v60 M77 98 v60 M32 113 h60 M32 128 h60 M32 143 h60\" stroke=\"#0F9E9C\" stroke-width=\"1.4\"><\u002Fpath>\n            <text x=\"62\" y=\"182\" text-anchor=\"middle\" font-family=\"Assistant\" font-weight=\"800\" font-size=\"13\" fill=\"#0A6E6D\">דגימה<\u002Ftext>\n            <text x=\"138\" y=\"112\" text-anchor=\"middle\" font-family=\"Suez One\" font-weight=\"700\" font-size=\"40\" fill=\"#0F9E9C\">×<\u002Ftext>\n            <path d=\"M108 128 h60\" stroke=\"#211C18\" stroke-width=\"4\" stroke-linecap=\"round\"><\u002Fpath>\n            <path d=\"M168 128 l-14 -8 m14 8 l-14 8\" stroke=\"#211C18\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath>\n            <rect x=\"196\" y=\"54\" width=\"134\" height=\"134\" rx=\"8\" fill=\"rgba(15,158,156,0.07)\" stroke=\"#211C18\" stroke-width=\"3.5\"><\u002Frect>\n            <g stroke=\"#0F9E9C\" stroke-width=\"1.2\">\n              <path d=\"M218 54 v134 M240 54 v134 M262 54 v134 M284 54 v134 M306 54 v134 M196 76 h134 M196 98 h134 M196 120 h134 M196 142 h134 M196 164 h134\"><\u002Fpath>\n            <\u002Fg>\n            <text x=\"263\" y=\"210\" text-anchor=\"middle\" font-family=\"Assistant\" font-weight=\"800\" font-size=\"13\" fill=\"#0A6E6D\">100% מהאי<\u002Ftext>\n          <\u002Fg>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font:800 18px 'Assistant'; color:#0A6E6D; letter-spacing:3px;\">כך מודדים · שלב 2<\u002Fdiv>\n        <h2 style=\"margin: 2px 0 6px; font: 700 54px/1.04 'Suez One','Assistant'; color: #211C18; font-family: Assistant\">מהחלק — אל השלם<\u002Fh2>\n        <p style=\"margin:0 0 12px; font:600 22px/1.45 'Assistant'; color:#4A433C; max-width:48ch;\">באמצעות הערך המשולש יודעים איזה אחוז מהשטח מייצגת הרשת — ומרחיבים ל‑100%. כך התגלה כמה פלסטיק יש באמת:<\u002Fp>\n        <div style=\"display:flex; gap:10px; flex-wrap:wrap;\">\n          <div style=\"border:2px solid #211C18; border-radius:12px 8px 12px 8px; padding:7px 14px; background:#EAF6F5;\"><span style=\"font:700 26px 'Suez One','Assistant'; color:#0A6E6D;\">1.8 טריליון<\u002Fspan><span style=\"font: 700 14px 'Assistant'; color: #4A433C; margin-right: 6px; font-size: 18px\">חלקיקים<\u002Fspan><\u002Fdiv>\n          <div style=\"border:2px solid #211C18; border-radius:8px 12px 8px 12px; padding:7px 14px; background:#EAF6F5;\"><span style=\"font:700 26px 'Suez One','Assistant'; color:#0A6E6D;\">80,000<\u002Fspan><span style=\"font: 700 14px 'Assistant'; color: #4A433C; margin-right: 6px; font-size: 18px\">טון<\u002Fspan><\u002Fdiv>\n          <div style=\"border:2px solid #211C18; border-radius:12px 8px 12px 8px; padding:7px 14px; background:#EAF6F5;\"><span style=\"font:700 26px 'Suez One','Assistant'; color:#0A6E6D;\">500<\u002Fspan><span style=\"font: 700 14px 'Assistant'; color: #4A433C; margin-right: 6px; font-size: 18px\">מטוסי ג׳מבו<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============ PANEL 7 — QUESTION ============ -->\n    <div data-panel=\"7\" style=\"position:absolute; left:3920px; top:4260px; width:800px; height:600px; z-index:1; background:#211C18; border:2.5px solid #211C18; border-radius:16px 22px 13px 20px / 20px 13px 22px 14px; box-shadow:7px 9px 0 rgba(15,158,156,.30); padding:36px 42px; display:flex; flex-direction:column; gap:12px; cursor:pointer; transition:opacity .6s ease, box-shadow .6s ease; box-sizing:border-box;\">\n      <div style=\"position:absolute; top:-16px; right:-16px; width:48px; height:48px; border-radius:50% 48% 52% 50%; background:#0F9E9C; border:2.5px solid #FCF8EE; display:flex; align-items:center; justify-content:center; font:700 28px 'Suez One','Assistant'; color:#FCF8EE; box-shadow:3px 4px 0 rgba(0,0,0,.3);\">08<\u002Fdiv>\n      <div style=\"flex:1; min-height:0; display:flex; align-items:center; justify-content:center;\">\n        <svg viewBox=\"0 0 360 240\" style=\"width:100%; height:100%;\" preserveAspectRatio=\"xMidYMid meet\" fill=\"none\">\n          <g filter=\"url(#rough)\">\n            <g transform=\"translate(20 50)\">\n              <rect x=\"0\" y=\"0\" width=\"88\" height=\"74\" rx=\"6\" fill=\"rgba(15,158,156,0.14)\" stroke=\"#7FE0DD\" stroke-width=\"3.5\"><\u002Frect>\n              <path d=\"M22 0 V74 M44 0 V74 M66 0 V74 M0 18 H88 M0 37 H88 M0 56 H88\" stroke=\"#0F9E9C\" stroke-width=\"1.6\"><\u002Fpath>\n              <circle cx=\"30\" cy=\"42\" r=\"8\" fill=\"none\" stroke=\"#F4EEDF\" stroke-width=\"2.5\"><\u002Fcircle>\n              <rect x=\"54\" y=\"22\" width=\"13\" height=\"22\" rx=\"4\" fill=\"#F4EEDF\" stroke=\"#211C18\" stroke-width=\"2\" transform=\"rotate(12 60 33)\"><\u002Frect>\n            <\u002Fg>\n            <g transform=\"translate(140 40) rotate(-6)\">\n              <path d=\"M0 0 h118 v44 h-118 l-16 -22z\" fill=\"#F4EEDF\" stroke=\"#F4EEDF\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath>\n              <text x=\"59\" y=\"32\" text-anchor=\"middle\" font-family=\"Assistant\" font-weight=\"800\" font-size=\"17\" fill=\"#211C18\">12 ק״ג<\u002Ftext>\n            <\u002Fg>\n            <g transform=\"translate(96 142) rotate(4)\">\n              <path d=\"M0 0 h256 v44 h-256 l-16 -22z\" fill=\"#0F9E9C\" stroke=\"#0F9E9C\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath>\n              <text x=\"128\" y=\"32\" text-anchor=\"middle\" font-family=\"Assistant\" font-weight=\"800\" font-size=\"16\" fill=\"#FCF8EE\">0.0001% מהשטח<\u002Ftext>\n            <\u002Fg>\n            <text x=\"306\" y=\"96\" text-anchor=\"middle\" font-family=\"Suez One\" font-weight=\"700\" font-size=\"130\" fill=\"#7FE0DD\">?<\u002Ftext>\n          <\u002Fg>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font:800 18px 'Assistant'; color:#7FE0DD; letter-spacing:3px;\">שאלת מחשבה<\u002Fdiv>\n        <h2 style=\"margin: 2px 0 6px; font: 700 56px/1.04 'Suez One','Assistant'; color: #FCF8EE; font-family: Assistant\">תורכם לחשב<\u002Fh2>\n        <p style=\"margin:0; font:600 23px/1.5 'Assistant'; color:#EDE6D6; max-width:42ch;\">רשת מחקר לכדה <b style=\"color:#7FE0DD;\">12 ק״ג<\u002Fb> בקבוקים, והיא מייצגת בדיוק <b style=\"color:#7FE0DD;\">0.0001%<\u002Fb> משטח האי. מה משקל הבקבוקים בכל האי?<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <!-- vignette -->\n  \n\n  <!-- title chip + dots -->\n  <div style=\"position:absolute; top:18px; right:22px; z-index:6; display:flex; flex-direction:column; align-items:flex-end; gap:10px;\">\n    \n    \n  <\u002Fdiv>\n\n  <!-- control bar -->\n  <div id=\"comic-nav\" dir=\"rtl\" style=\"position:absolute; bottom:14px; left:50%; transform:translateX(-50%); z-index:6; display:flex; align-items:center; gap:10px; background:#FCF8EE; border:2.5px solid #211C18; border-radius:999px; padding:8px 12px; box-shadow:5px 6px 0 rgba(33,28,24,.16);\">\n    <button onclick=\"{{ prev }}\" style=\"display:flex; align-items:center; gap:7px; border:2.5px solid #211C18; background:transparent; color:#211C18; font:800 17px 'Assistant'; padding:9px 16px; border-radius:999px; cursor:pointer;\"><span>קודם<\u002Fspan><span style=\"font-size:18px;\">→<\u002Fspan><\u002Fbutton>\n    <div dir=\"ltr\" style=\"font:700 30px 'Suez One','Assistant'; color:#211C18; min-width:84px; text-align:center; letter-spacing:1px; direction:ltr; unicode-bidi:isolate;\">{{ counter }} / {{ total }}<\u002Fdiv>\n    <button onclick=\"{{ next }}\" style=\"display:flex; align-items:center; gap:7px; border:2.5px solid #211C18; background:#0F9E9C; color:#FCF8EE; font:800 17px 'Assistant'; padding:9px 18px; border-radius:999px; cursor:pointer; box-shadow:2px 3px 0 rgba(33,28,24,.18);\"><span style=\"font-size:18px;\">←<\u002Fspan><span>הבא<\u002Fspan><\u002Fbutton>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.panels = [\n      { cx: 4500, cy: 600,  w: 820, h: 600 },\n      { cx: 3300, cy: 820,  w: 760, h: 540 },\n      { cx: 2400, cy: 1680, w: 780, h: 600 },\n      { cx: 2720, cy: 2720, w: 840, h: 560 },\n      { cx: 1600, cy: 3000, w: 780, h: 620 },\n      { cx: 1820, cy: 4060, w: 840, h: 580 },\n      { cx: 3060, cy: 4320, w: 880, h: 640 },\n      { cx: 4320, cy: 4560, w: 800, h: 600 }\n    ];\n    let start = 0;\n    this.rootRef = React.createRef();\n    this.worldRef = React.createRef();\n    this.state = {\n      idx: start,\n      vw: (typeof window !== 'undefined' ? window.innerWidth : 1280),\n      vh: (typeof window !== 'undefined' ? window.innerHeight : 800),\n      overview: false\n    };\n    // Every panel must be viewed before the host lomda unlocks its המשך button.\n    this.visited = new Set([start]);\n    this._doneSent = false;\n  }\n\n  markVisited() {\n    this.visited.add(this.state.idx);\n    if (!this._doneSent && this.visited.size === this.panels.length) {\n      this._doneSent = true;\n      try { window.parent.postMessage({ type: 'PLASTIC_COMIC_DONE' }, '*'); } catch (e) {}\n    }\n  }\n\n  componentDidMount() {\n    this.measure();\n    setTimeout(() => this.measure(), 140);\n    this._rs = () => this.measure();\n    window.addEventListener('resize', this._rs);\n    this._kd = (e) => {\n      if (e.key === 'ArrowLeft' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); this.next(); }\n      else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); this.prev(); }\n    };\n    window.addEventListener('keydown', this._kd);\n    const el = this.rootRef.current;\n    if (el) {\n      this._click = (e) => {\n        const dot = e.target.closest && e.target.closest('[data-dot]');\n        if (dot) { this.goTo(+dot.getAttribute('data-dot')); return; }\n        if (e.target.closest && e.target.closest('button')) return;\n        const panel = e.target.closest && e.target.closest('[data-panel]');\n        if (panel) { this.goTo(+panel.getAttribute('data-panel')); }\n      };\n      el.addEventListener('click', this._click);\n    }\n    // Place the first panel instantly; navigation flies via the rAF tween.\n    this.applyCamera(false);\n    this.applyFocus();\n  }\n\n  applyCamera(animate) {\n    // Manual rAF tween: CSS transitions and WAAPI both stall on this element\n    // (React re-renders reset the transition base every frame). Driving the\n    // inline transform ourselves each frame is immune — if a re-render clears\n    // it, the next frame re-sets it.\n    const w = this.worldRef.current;\n    if (!w) return;\n    const target = this.camera();\n    if (this._raf) { cancelAnimationFrame(this._raf); this._raf = null; }\n    if (this._snap) { clearTimeout(this._snap); this._snap = null; }\n    // Safety net: commit the final transform immediately so the resting state is\n    // always correct even if rAF is paused (hidden tab). The tween then overrides\n    // it visually frame-by-frame while animating.\n    w.style.transform = this.camStr(target);\n    if (animate === false || !this._cam) { this._cam = target; return; }\n    const from = { tx: this._cam.tx, ty: this._cam.ty, s: this._cam.s };\n    const dur = 1000, t0 = performance.now();\n    const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);\n    const step = (now) => {\n      const p = Math.min(1, (now - t0) / dur);\n      const e = ease(p);\n      const cur = {\n        tx: from.tx + (target.tx - from.tx) * e,\n        ty: from.ty + (target.ty - from.ty) * e,\n        s: from.s + (target.s - from.s) * e\n      };\n      this._cam = cur;\n      w.style.transform = this.camStr(cur);\n      if (p < 1) { this._raf = requestAnimationFrame(step); }\n      else { this._cam = target; this._raf = null; w.style.transform = this.camStr(target); }\n    };\n    this._raf = requestAnimationFrame(step);\n    // Hard fallback: guarantee we land on target even if rAF never fires.\n    this._snap = setTimeout(() => {\n      if (this._raf) { cancelAnimationFrame(this._raf); this._raf = null; }\n      this._cam = target;\n      const ww = this.worldRef.current;\n      if (ww) ww.style.transform = this.camStr(target);\n    }, dur + 120);\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('resize', this._rs);\n    window.removeEventListener('keydown', this._kd);\n  }\n\n  componentDidUpdate() {\n    this.markVisited();\n    this.applyCamera();\n    this.applyFocus();\n    try { localStorage.setItem('seacomic.idx', String(this.state.idx)); } catch (e) {}\n  }\n\n  measure() {\n    const el = this.rootRef.current;\n    const vw = (el && el.clientWidth) ? el.clientWidth : window.innerWidth;\n    const vh = (el && el.clientHeight) ? el.clientHeight : window.innerHeight;\n    this.setState({ vw, vh });\n  }\n\n  goTo(i) { this.setState({ idx: Math.min(this.panels.length - 1, Math.max(0, i)), overview: false }); }\n  next() { if (this.state.overview) { this.setState({ overview: false }); return; } this.goTo(this.state.idx + 1); }\n  prev() { if (this.state.overview) { this.setState({ overview: false }); return; } this.goTo(this.state.idx - 1); }\n\n  bounds() {\n    let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;\n    this.panels.forEach((p) => {\n      minX = Math.min(minX, p.cx - p.w / 2); minY = Math.min(minY, p.cy - p.h / 2);\n      maxX = Math.max(maxX, p.cx + p.w / 2); maxY = Math.max(maxY, p.cy + p.h / 2);\n    });\n    return { minX, minY, maxX, maxY };\n  }\n\n  camera() {\n    const { vw, vh, idx, overview } = this.state;\n    let s, tx, ty;\n    if (overview) {\n      // Center the whole story within the safe area, leaving room for the top\n      // chip and the bottom control bar so no panel is clipped or hidden.\n      const b = this.bounds(), m = 150;\n      const topPad = 96, botPad = 128, sidePad = 56;\n      const availW = vw - sidePad * 2, availH = vh - topPad - botPad;\n      const bw = (b.maxX - b.minX) + m * 2, bh = (b.maxY - b.minY) + m * 2;\n      s = Math.min(availW / bw, availH / bh);\n      const cx = (b.minX + b.maxX) / 2, cy = (b.minY + b.maxY) / 2;\n      tx = vw / 2 - s * cx;\n      ty = (topPad + availH / 2) - s * cy;\n    } else {\n      const topPad = 20, botPad = 80, sidePad = 30;\n      const availW = vw - sidePad * 2, availH = vh - topPad - botPad;\n      const p = this.panels[idx];\n      s = Math.min(availW / p.w, availH / p.h) * 0.97;\n      s = Math.min(s, 1.6);\n      tx = vw / 2 - s * p.cx;\n      ty = (topPad + availH / 2) - s * p.cy;\n    }\n    return { tx: tx, ty: ty, s: s };\n  }\n\n  camStr(c) {\n    return 'translate(' + c.tx.toFixed(2) + 'px, ' + c.ty.toFixed(2) + 'px) scale(' + c.s.toFixed(4) + ')';\n  }\n\n  applyFocus() {\n    const el = this.rootRef.current;\n    if (!el) return;\n    el.querySelectorAll('[data-panel]').forEach((n) => {\n      const i = +n.getAttribute('data-panel');\n      const active = (i === this.state.idx);\n      n.style.opacity = active ? '1' : '0';\n      n.style.visibility = active ? 'visible' : 'hidden';\n      n.style.pointerEvents = active ? 'auto' : 'none';\n      if (i === 7) {\n        n.style.boxShadow = active ? '9px 11px 0 rgba(15,158,156,.42)' : '7px 9px 0 rgba(15,158,156,.30)';\n      } else {\n        n.style.boxShadow = active ? '9px 11px 0 rgba(15,158,156,.24)' : '7px 9px 0 rgba(33,28,24,.13)';\n      }\n    });\n    el.querySelectorAll('[data-dot]').forEach((n) => {\n      n.style.background = (+n.getAttribute('data-dot') === this.state.idx) ? '#0F9E9C' : 'transparent';\n    });\n    const ov = el.querySelector('[data-ov]');\n    if (ov) {\n      ov.style.background = this.state.overview ? '#0F9E9C' : 'transparent';\n      ov.style.color = this.state.overview ? '#FCF8EE' : '#211C18';\n    }\n  }\n\n  renderVals() {\n    return {\n      rootRef: this.rootRef,\n      worldRef: this.worldRef,\n      counter: String(this.state.idx + 1).padStart(2, '0'),\n      total: String(this.panels.length).padStart(2, '0'),\n      next: () => this.next(),\n      prev: () => this.prev(),\n      toggleOverview: () => this.setState((s) => ({ overview: !s.overview }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
